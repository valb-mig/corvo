[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/valb-mig/corvo"

[workspace.dependencies]
corvo-agent = { path = "crates/agent" }
corvo-domain = { path = "crates/domain" }
corvo-fs = { path = "crates/fs" }
corvo-git = { path = "crates/git" }
corvo-ui = { path = "crates/ui" }
corvo-lsp = { path = "crates/lsp" }
corvo-syntax = { path = "crates/syntax" }
gpui-kit = { version = "0.10", default-features = false }
agent-client-protocol-schema = { version = "1.22", default-features = false }
ignore = "0.4"
anyhow = "1"
base64 = "0.22"
futures = "0.3"
libc = "0.2"
lsp-server = "0.10"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tree-sitter = "0.26"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-kotlin-sg = "0.4"
tree-sitter-php = "0.24"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[profile.dev.package."*"]
opt-level = 3
